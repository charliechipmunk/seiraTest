<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #1a242c; /* Il grigio scuro della foto */
            color: #d1d1d1;
            font-family: 'Consolas', 'Monaco', monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        /* Header con bordi azzurri come in foto */
        #header-controls {
            border-top: 2px solid #5a7d8c;
            border-bottom: 2px solid #5a7d8c;
            padding: 10px 0;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .row { margin-bottom: 4px; display: flex; align-items: center; }
        label { width: 60px; display: inline-block; }
        
        input, select {
            background: #fff;
            border: 1px solid #000;
            font-family: monospace;
            padding: 1px 3px;
            color: #000;
        }

        #enter-btn {
            background: #bdc3c7;
            border: 1px solid #000;
            cursor: pointer;
            padding: 0 5px;
            font-family: monospace;
            margin-right: 5px;
        }

        /* Area messaggi */
        #chat-window {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .msg-line {
            padding: 5px 0;
            border-bottom: 1px solid #4a4a4a; /* Linea grigia divisoria */
            font-size: 15px;
            line-height: 1.2;
        }

        /* Colori nomi utenti */
        .user-name { font-weight: bold; }
        .color-W { color: #ffffff; } /* White */
        .color-R { color: #ff3333; } /* Red */
        .color-G { color: #33ff33; } /* Green */
        .color-B { color: #3333ff; } /* Blue */

        /* Area input in fondo */
        #input-area {
            display: flex;
            gap: 5px;
            padding-top: 5px;
            border-top: 1px solid #5a7d8c;
        }
        #msg-input { flex-grow: 1; background: #000; color: #fff; border: 1px solid #5a7d8c; padding: 5px; }
        #send-btn { background: #ff3333; color: #fff; border: none; padding: 0 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="header-controls">
        <div class="row"><label>Name</label><input type="text" id="user-name" value="Neidhardt"></div>
        <div class="row">
            <label>Color</label>
            <select id="user-color">
                <option value="W" selected>W</option>
                <option value="R">R</option>
                <option value="G">G</option>
                <option value="B">B</option>
            </select>
        </div>
        <div class="row">
            <label>Reload</label>
            <select id="reload-time">
                <option value="10" selected>10</option>
                <option value="5">5</option>
            </select>
        </div>
        <div class="row">
            <button id="enter-btn" onclick="connect()">Enter</button>
            <span>Current members (2)</span>
        </div>
    </div>

    <div id="chat-window">
        </div>

    <div id="input-area">
        <input type="text" id="msg-input" placeholder="Scrivi un messaggio...">
        <button id="send-btn" onclick="sendMsg()">Invia</button>
    </div>

    <script>
        // --- DATI DI CONNESSIONE ---
        const SB_URL = 'https://bkdkhdrmcwazfqmvgiki.supabase.co'; 
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrZGtoZHJtY3dhemZxbXZnaWtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNzE4MjEsImV4cCI6MjA5Mzc0NzgyMX0.cuU7uAqy7jbCFSO60_oOTk6a9c2eq39lxpWGC4nHn5k'; 

        // Inizializziamo con un nome diverso per evitare l'errore "redeclaration"
        const sbClient = supabase.createClient(SB_URL, SB_KEY);

        async function loadMessages() {
            const { data, error } = await sbClient
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error("Errore caricamento:", error);
                return;
            }

            const chatWindow = document.getElementById('chat-window');
            chatWindow.innerHTML = data.map(m => `
                <div class="msg-line">
                    <span class="user-name color-${m.color}">${m.name}</span>: ${m.content}
                </div>
            `).join('');
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        async function sendMsg() {
            const name = document.getElementById('user-name').value;
            const color = document.getElementById('user-color').value;
            const content = document.getElementById('msg-input').value;

            if (!content.trim()) return;

            const { error } = await sbClient
                .from('messages')
                .insert([{ name, color, content }]);

            if (error) {
                alert("Errore nell'invio!");
            } else {
                document.getElementById('msg-input').value = '';
                loadMessages();
            }
        }

        function connect() {
            loadMessages();
            const sec = document.getElementById('reload-time').value;
            setInterval(loadMessages, sec * 1000);
            alert("Chat connessa!");
        }

        // Invio con tasto Enter
        document.getElementById('msg-input').addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMsg();
        });

        // Caricamento iniziale
        loadMessages();
    </script>
</body>
</html>
