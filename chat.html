<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    
    <style>
        body {
            background-color: #1a242c; 
            color: #d1d1d1;
            font-family: 'Consolas', 'Monaco', monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        #header-controls {
            border-top: 2px solid #5a7d8c;
            border-bottom: 2px solid #5a7d8c;
            padding: 8px 0;
            margin-bottom: 5px;
        }

        .controls-grid {
            display: flex;
            flex-direction: column;
            gap: 2px;
            max-width: 250px;
        }

        .row { display: flex; align-items: center; }
        label { width: 60px; font-size: 13px; color: #fff; }
        
        input, select {
            background: #fff;
            border: 1px solid #000;
            font-family: monospace;
            padding: 0 2px;
            color: #000;
            font-size: 13px;
            height: 20px;
        }

        #enter-btn {
            background: #bdc3c7;
            border: 1px solid #000;
            cursor: pointer;
            padding: 0 8px;
            font-family: monospace;
            font-size: 13px;
            height: 20px;
            margin-right: 5px;
        }

        .status-text { font-size: 13px; }

        #chat-window {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 10px;
            display: flex;
            flex-direction: column;
        }

        .msg-line {
            padding: 6px 0;
            border-bottom: 1px solid #3d4b53;
            font-size: 14px;
            line-height: 1.2;
        }

        .user-name { font-weight: bold; }
        .color-W { color: #ffffff; } 
        .color-R { color: #ff4444; } 
        .color-G { color: #44ff44; } 
        .color-B { color: #5555ff; }

        #input-area {
            display: flex;
            gap: 5px;
            padding-top: 10px;
            border-top: 2px solid #5a7d8c;
        }
        
        #msg-input { 
            flex-grow: 1; 
            background: #000; 
            color: #fff; 
            border: 1px solid #5a7d8c; 
            padding: 8px;
            font-size: 16px;
        }
        
        #send-btn { 
            background: #ff4444; 
            color: #fff; 
            border: none; 
            padding: 0 15px; 
            cursor: pointer; 
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .controls-grid { max-width: 100%; }
            label { width: 70px; font-size: 15px; }
            input, select { height: 25px; font-size: 15px; }
            .msg-line { font-size: 15px; }
        }
    </style>
</head>
<body>

    <div id="header-controls">
        <div class="controls-grid">
            <div class="row"><label>Name</label><input type="text" id="user-name"></div>
            <div class="row">
                <label>Color</label>
                <select id="user-color">
                    <option value="W">W</option>
                    <option value="R">R</option>
                    <option value="G">G</option>
                    <option value="B">B</option>
                </select>
            </div>
            <div class="row">
                <label>Reload</label>
                <select id="msg-limit">
                    <option value="5">5</option>
                    <option value="10" selected>10</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="1000">All</option>
                </select>
            </div>
            <div class="row">
                <button id="enter-btn" onclick="window.manualRefresh()">Enter</button>
                <span class="status-text">Current members (2)</span>
            </div>
        </div>
    </div>

    <div id="chat-window"></div>

    <div id="input-area">
        <input type="text" id="msg-input" placeholder="">
        <button id="send-btn" onclick="window.sendMsg()">Invia</button>
    </div>

    <script>
        // Inizializzazione Client
        const sbClient = supabase.createClient(CONFIG.SB_URL, CONFIG.SB_KEY);
        const chatWindow = document.getElementById('chat-window');

        // Salvataggio Profilo
        window.saveProfile = function() {
            const name = document.getElementById('user-name').value;
            const color = document.getElementById('user-color').value;
            localStorage.setItem('chat-name', name);
            localStorage.setItem('chat-color', color);
        };

        // Caricamento Profilo
        window.loadProfile = function() {
            const savedName = localStorage.getItem('chat-name');
            const savedColor = localStorage.getItem('chat-color');
            if (savedName) document.getElementById('user-name').value = savedName;
            else document.getElementById('user-name').value = "Neidhardt";
            if (savedColor) document.getElementById('user-color').value = savedColor;
        };

        // Caricamento Messaggi
        window.loadMessages = async function() {
            const limit = document.getElementById('msg-limit').value;
            const { data, error } = await sbClient
                .from('messages')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(parseInt(limit));

            if (error) return;

            chatWindow.innerHTML = data.map(m => `
                <div class="msg-line">
                    <span class="user-name color-${m.color}">${m.name}</span>: ${m.content}
                </div>
            `).join('');
        };

        // Invio Messaggio
        window.sendMsg = async function() {
            const name = document.getElementById('user-name').value;
            const color = document.getElementById('user-color').value;
            const content = document.getElementById('msg-input').value;

            if (!content.trim()) return;
            window.saveProfile();

            const { error } = await sbClient
                .from('messages')
                .insert([{ name, color, content }]);

            if (!error) {
                document.getElementById('msg-input').value = '';
                window.loadMessages();
            }
        };

        window.manualRefresh = function() {
            window.saveProfile();
            window.loadMessages();
        };

        // Eventi e Timer
        document.getElementById('msg-input').addEventListener("keypress", (e) => {
            if (e.key === "Enter") window.sendMsg();
        });

        // Eventi per salvare appena cambi nome/colore
        document.getElementById('user-name').addEventListener("input", window.saveProfile);
        document.getElementById('user-color').addEventListener("change", window.saveProfile);

        // Avvio
        window.loadProfile();
        window.loadMessages();
        setInterval(window.loadMessages, 1000);
    </script>
</body>
</html>
