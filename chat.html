<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Private Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        body {
            background-color: #000; color: #d1d1d1;
            font-family: 'Courier New', Courier, monospace; 
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            height: 100vh; height: -webkit-fill-available;
            overflow: hidden;
            position: fixed; width: 100%;
        }

        #header-controls { 
            background: #1a242c; border-top: 2px solid #5a7d8c; border-bottom: 2px solid #5a7d8c; 
            padding: 8px 10px; flex-shrink: 0; 
        }
        .controls-grid { display: flex; flex-direction: column; gap: 4px; max-width: 280px; }
        .row { display: flex; align-items: center; }
        label { width: 60px; font-size: 12px; color: #fff; }
        input, select { background: #fff; border: 1px solid #000; padding: 0 4px; font-size: 13px; height: 20px; font-family: inherit; }

        .status-container { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        #enter-btn { 
            background: #bdc3c7; border: 1px solid #000; cursor: pointer; 
            padding: 0 10px; font-size: 12px; height: 22px; 
            color: #000; font-family: inherit;
        }
        #status-text { color: #fff; font-size: 13px; text-transform: lowercase; }

        #chat-window { 
            flex-grow: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; 
            background-color: #000; -webkit-overflow-scrolling: touch;
        }
        .msg-line { padding: 4px 0; border-bottom: 1px solid #1a1a1a; font-size: 14px; }
        .user-name { font-weight: bold; }
        
        .color-W { color: #ffffff !important; } .color-R { color: #ff4444 !important; } 
        .color-G { color: #44ff44 !important; } .color-B { color: #5555ff !important; }

        #input-area {
            flex-shrink: 0; display: flex; gap: 8px; padding: 10px;
            border-top: 2px solid #5a7d8c; background: #000;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
        }
        #msg-input { flex-grow: 1; background: #111; color: #fff; border: 1px solid #5a7d8c; padding: 10px; font-size: 16px; font-family: inherit; }
        #send-btn { background: #ff4444; color: #fff; border: none; padding: 0 15px; cursor: pointer; font-weight: bold; font-family: inherit; }
    </style>
</head>
<body>

    <div id="header-controls">
        <div class="controls-grid">
            <div class="row"><label>Name</label><input type="text" id="user-name" spellcheck="false"></div>
            <div class="row">
                <label>Color</label>
                <select id="user-color">
                    <option value="W">White</option><option value="R">Red</option>
                    <option value="G">Green</option><option value="B">Blue</option>
                </select>
            </div>
            <div class="row">
                <label>Reload</label>
                <select id="msg-limit" onchange="window.loadMessages()">
                    <option value="10">10</option><option value="50">50</option>
                    <option value="100">100</option><option value="1000">All</option>
                </select>
            </div>
            <div class="status-container">
                <button id="enter-btn" onclick="window.requestAccess()">Enter</button>
                <span id="status-text">offline</span>
            </div>
        </div>
    </div>

    <div id="chat-window"></div>

    <div id="input-area">
        <input type="text" id="msg-input" placeholder="Type a message...">
        <button id="send-btn" onclick="window.sendMsg()">Send</button>
    </div>

    <script>
        // Fix tastiera mobile
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                document.body.style.height = window.visualViewport.height + 'px';
                window.scrollTo(0, 0);
            });
        }

        let sbClient = null;
        let chatChannel = null;

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        window.requestAccess = async function() {
            const input = prompt("Enter Database Password:");
            if (input) {
                const hashedInput = await sha256(input);
                if (hashedInput === CONFIG.PASS_HASH) {
                    localStorage.setItem('app-auth-session', hashedInput);
                    window.initApp();
                } else {
                    alert("Wrong Password.");
                }
            }
        };

        window.initApp = function() {
            const sessionHash = localStorage.getItem('app-auth-session');
            if (sessionHash !== CONFIG.PASS_HASH) return;
            sbClient = supabase.createClient(CONFIG.SB_URL, CONFIG.SB_KEY);
            window.loadMessages();
            initRealtime();
        };

        window.loadMessages = async function() {
            if (!sbClient) return;
            const limit = document.getElementById('msg-limit').value === "1000" ? 1000 : parseInt(document.getElementById('msg-limit').value);
            const { data, error } = await sbClient.from('messages').select('*').order('created_at', { ascending: false }).limit(limit);
            if (!error) renderMessages(data);
        };

        function initRealtime() {
            if (chatChannel) sbClient.removeChannel(chatChannel);

            // Generiamo un ID sessione unico per evitare che schede diverse con lo stesso nome si sovrappongano
            const sessionID = Math.random().toString(36).substring(7);

            chatChannel = sbClient.channel('room-1', {
                config: { presence: { key: sessionID } }
            });

            chatChannel
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                    addSingleMsg(payload.new);
                })
                .on('presence', { event: 'sync' }, () => {
                    const count = Object.keys(chatChannel.presenceState()).length;
                    document.getElementById('status-text').innerText = `current members (${count})`;
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await chatChannel.track({ 
                            online_at: new Date().toISOString(),
                            name: document.getElementById('user-name').value 
                        });
                    }
                });
        }

        function renderMessages(data) {
            // Ordine decrescente: ultimo in alto
            document.getElementById('chat-window').innerHTML = data.map(m => `
                <div class="msg-line color-${m.color}"><span class="user-name">${m.name}</span>: ${m.content}</div>
            `).join('');
        }

        function addSingleMsg(m) {
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            div.className = `msg-line color-${m.color}`;
            div.innerHTML = `<span class="user-name">${m.name}</span>: ${m.content}`;
            // Inserisce in cima alla lista
            win.prepend(div);
        }

        window.sendMsg = async function() {
            const name = document.getElementById('user-name').value;
            const color = document.getElementById('user-color').value;
            const content = document.getElementById('msg-input').value;
            if (!content.trim() || !sbClient) return;
            await sbClient.from('messages').insert([{ name, color, content }]);
            document.getElementById('msg-input').value = '';
        };

        window.loadProfile = () => {
            document.getElementById('user-name').value = localStorage.getItem('chat-name') || "user";
            document.getElementById('user-color').value = localStorage.getItem('chat-color') || "W";
        };
        
        window.saveProfile = () => {
            localStorage.setItem('chat-name', document.getElementById('user-name').value);
            localStorage.setItem('chat-color', document.getElementById('user-color').value);
            if (chatChannel) initRealtime();
        };

        document.getElementById('user-name').addEventListener("change", window.saveProfile);
        document.getElementById('user-color').addEventListener("change", window.saveProfile);
        document.getElementById('msg-input').addEventListener("keypress", e => { if(e.key === "Enter") window.sendMsg(); });

        window.loadProfile();
        window.initApp();
    </script>
</body>
</html>
