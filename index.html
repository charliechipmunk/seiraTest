<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seira</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'MS Mincho', 'Sawarabi Mincho', serif;
        }

        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 1.2s ease-in-out;
        }

        .bg-wrap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: #ff0000;
            line-height: 0.9;
            text-align: center;
            word-break: break-all;
            overflow: hidden;
            z-index: -1;
            opacity: 0.8;
            user-select: none;
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
            transition: all 0.5s ease-in-out;
        }

        .login-box {
            text-align: center;
            z-index: 2;
        }

        input[type="password"] {
            padding: 15px;
            border-radius: 2px;
            border: none;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            text-align: center;
            font-size: 20px;
            outline: none;
            width: 300px;
            box-shadow: 0 0 20px 2px #ff0000;
        }

        #main-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1;
            background-color: #000;
        }

        #main-image {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-90deg);
            max-height: 100vw;
            max-width: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="bg-wrap" id="text-fill"></div>
        <div class="login-box">
            <input type="password" id="password-input" autofocus>
        </div>
    </div>

    <div id="main-content">
        <img id="main-image" src="seira.jpg" alt="">
    </div>

    <audio id="myAudio" loop preload="auto">
        <source src="seira.mp3" type="audio/mpeg">
    </audio>

    <script>
        const p = "その目だれの目";
        const container = document.getElementById('text-fill');
        const input = document.getElementById("password-input");
        const login = document.getElementById("login-screen");
        const main = document.getElementById("main-content");
        const audio = document.getElementById("myAudio");

        let stage = 0;
        const stages = [1.5, 4, 8, 15, 30]; // Dimensioni font progressive

        function update() {
            if (stage >= stages.length - 1) {
                // Stadio Finale: Una sola scritta, gigante, va a capo per lettera
                container.style.fontSize = "25vh"; 
                container.style.lineHeight = "1";
                container.style.flexDirection = "column";
                container.innerText = p; 
            } else {
                const fs = stages[stage];
                container.style.fontSize = fs + "vmin";
                container.innerText = p.repeat(Math.floor(4000 / fs));
            }
        }

        update();

        const H = "0c7f1c038d52a32bde100d5e2d80422fc6389ba1ccda56fb02d0bba722f25ef5";

        async function s(t) {
            const e = new TextEncoder().encode(t);
            const r = await crypto.subtle.digest('SHA-256', e);
            return Array.from(new Uint8Array(r)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        input.addEventListener("keypress", async function(e) {
            if (e.key === "Enter") {
                const h = await s(input.value);
                if (h === H) {
                    main.style.display = "flex";
                    audio.play();
                    login.style.opacity = "0";
                    setTimeout(() => { login.style.display = "none"; }, 1200);
                } else {
                    if (stage < stages.length - 1) {
                        stage++;
                        update();
                    }
                    input.value = "";
                    input.style.boxShadow = "0 0 60px 15px #ff0000";
                    setTimeout(() => { input.style.boxShadow = "0 0 20px 2px #ff0000"; }, 200);
                }
            }
        });
    </script>
</body>
</html>
